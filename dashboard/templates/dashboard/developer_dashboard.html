
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Project | Growfession</title>

    <link rel="stylesheet" href="{% static 'dashboard/css/developer_dashboard.css' %}">
</head>

<body>

    <div class="dashboard-layout">

        <main class="main-content">

            <header class="topbar">
                <div>
                    <p class="topbar-label">DEVELOPER WORKSPACE</p>
                    <h3>My Projects</h3>
                </div>

                <a href="{% url 'project_list' %}">Back to Projects</a>
            </header>

            <section class="content-section">

                <div class="section-heading">
                    <div>
                        <p class="section-label">SHOWCASE YOUR WORK</p>
                        <h2>Add a New Project</h2>
                        <p class="section-description">
                            Tell us about something you've built.
                        </p>
                    </div>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit">Save Project</button>
                    <a href="{% url 'project_list' %}">Cancel</a>
                </form>

            </section>

        </main>

    </div>

</body>
</html>
