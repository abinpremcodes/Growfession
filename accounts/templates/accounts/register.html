
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Growfession</title>
</head>
<body>

    <h1>Create Your Growfession Account</h1>

    <!-- Display Django messages -->
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <!-- Registration Form -->
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

</body>
</html>
